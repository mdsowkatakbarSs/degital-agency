name: Production Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: prod-audit
  cancel-in-progress: false

jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel deployment
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.ytgrowthgear.shop/)
            if [ "$CODE" = "200" ]; then echo "Site is up"; exit 0; fi
            echo "attempt $i: HTTP $CODE, retrying in 15s..."; sleep 15
          done
          echo "Site did not come up in time"; exit 1

      - name: Audit production
        run: npm run audit:site
        env:
          AUDIT_BASE_URL: https://www.ytgrowthgear.shop

      - name: Summarize failures
        if: failure()
        run: |
          echo "## Production audit failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The site audit against https://www.ytgrowthgear.shop reported failures." >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally with: \`AUDIT_BASE_URL=https://www.ytgrowthgear.shop npm run audit:site\`" >> "$GITHUB_STEP_SUMMARY"
